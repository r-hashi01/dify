name: Code Quality Checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - 'api/**/*.py'
      - '.github/workflows/code-quality.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: code-quality-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  complexity-check:
    name: Code Complexity Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Radon
        run: uv pip install radon

      # Cyclomatic Complexity Check
      - name: Check Cyclomatic Complexity
        run: |
          echo "## 🔍 Code Complexity Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic Complexity" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show all functions with complexity >= B (moderate)
          uv run radon cc api --min B --show-complexity >> $GITHUB_STEP_SUMMARY || true
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Fail if any function has complexity >= D (high)
          HIGH_COMPLEXITY=$(uv run radon cc api --min D --json)
          if [ "$HIGH_COMPLEXITY" != "{}" ]; then
            echo "❌ **Functions with high complexity detected:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "$HIGH_COMPLEXITY" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please refactor these functions to reduce complexity." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "✅ All functions have acceptable complexity" >> $GITHUB_STEP_SUMMARY

      # Maintainability Index
      - name: Check Maintainability Index
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          uv run radon mi api --min B --show >> $GITHUB_STEP_SUMMARY || true

  duplication-check:
    name: Code Duplication Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --project api --dev

      - name: Check Code Duplication
        run: |
          echo "## 🔄 Code Duplication Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          uv pip install pylint
          uv run pylint --disable=all --enable=duplicate-code api > duplication-report.txt || true
          
          if grep -q "Similar lines" duplication-report.txt; then
            echo "⚠️ **Code duplication detected:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat duplication-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consider refactoring duplicated code into reusable functions." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No significant code duplication detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

  dead-code-check:
    name: Dead Code Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup UV and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Vulture
        run: uv pip install vulture

      - name: Check Dead Code
        run: |
          echo "## 💀 Dead Code Detection" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          uv run vulture api --min-confidence 80 > dead-code-report.txt || true
          
          if [ -s dead-code-report.txt ]; then
            echo "⚠️ **Potentially unused code detected:**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat dead-code-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review and remove unused code if confirmed." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No unused code detected" >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: true

      - name: Upload Dead Code Report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dead-code-report
          path: dead-code-report.txt
          retention-days: 30
