name: Security Scans

on:
  workflow_call:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    - cron: '0 0 * * 0'  # 毎週日曜日 0:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

concurrency:
  group: security-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            api/**
            .github/workflows/security.yml

      - name: Setup UV and Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv sync --project api

      # Bandit: Pythonセキュリティスキャナー
      - name: Run Bandit Security Scanner
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          uv pip install bandit[toml]
          uv run bandit -r api -f json -o bandit-report.json || true
          uv run bandit -r api -ll

      - name: Upload Bandit Report
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      # Safety: 依存関係の脆弱性チェック
      - name: Run Safety Check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          uv pip install safety
          uv run safety check --json || true
          uv run safety check
        continue-on-error: true

      # Pip-audit: より新しい依存関係チェッカー
      - name: Run pip-audit
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          uv pip install pip-audit
          uv run pip-audit --format json > pip-audit-report.json || true
          uv run pip-audit
        continue-on-error: true

      - name: Upload pip-audit Report
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            api/Dockerfile
            web/Dockerfile
            docker/**
            .github/workflows/security.yml

      # Trivy: Dockerイメージとファイルシステムの脆弱性スキャン
      - name: Run Trivy vulnerability scanner (API)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './api'
          format: 'sarif'
          output: 'trivy-api-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy API results to GitHub Security
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'trivy-api'

      - name: Run Trivy vulnerability scanner (Web)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: './web'
          format: 'sarif'
          output: 'trivy-web-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Web results to GitHub Security
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-web-results.sarif'
          category: 'trivy-web'

  web-security:
    name: Web Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.2
        with:
          persist-credentials: false

      - name: Check changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            web/**
            .github/workflows/security.yml

      - name: Install pnpm
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
          run_install: false

      - name: Setup Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./web/package.json

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm install --frozen-lockfile

      # npm audit for security vulnerabilities
      - name: Run npm audit
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          pnpm audit --json > audit-report.json || true
          pnpm audit --audit-level=high
        continue-on-error: true

      - name: Upload audit Report
        if: always() && steps.changed-files.outputs.any_changed == 'true'
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: npm-audit-report
          path: web/audit-report.json
          retention-days: 30
